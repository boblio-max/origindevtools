name: Build and Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller

      - name: Build executable
        run: pyinstaller --onefile --name origin origin_cli/main.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: origin-windows-x86_64
          path: dist/origin.exe

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller

      - name: Build executable
        run: pyinstaller --onefile --name origin origin_cli/main.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: origin-linux-x86_64
          path: dist/origin

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller

      - name: Build executable
        run: pyinstaller --onefile --name origin origin_cli/main.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: origin-macos-x86_64
          path: dist/origin

  checksums:
    needs: [build-windows, build-linux, build-macos]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Generate checksums
        run: |
          echo "$(sha256sum origin-windows-x86_64/origin.exe | awk '{print $1}')  origin-windows-x86_64.exe" >> checksums.txt
          echo "$(sha256sum origin-linux-x86_64/origin | awk '{print $1}')  origin-linux-x86_64" >> checksums.txt
          echo "$(sha256sum origin-macos-x86_64/origin | awk '{print $1}')  origin-macos-x86_64" >> checksums.txt

      - name: Upload checksums
        uses: actions/upload-artifact@v4
        with:
          name: checksums
          path: checksums.txt

  release:
    needs: [build-windows, build-linux, build-macos, checksums]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Rename artifacts for release
        run: |
          mv origin-windows-x86_64/origin.exe origin-windows-x86_64.exe
          mv origin-linux-x86_64/origin origin-linux-x86_64
          mv origin-macos-x86_64/origin origin-macos-x86_64
          mv checksums/checksums.txt checksums.txt

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            origin-windows-x86_64.exe
            origin-linux-x86_64
            origin-macos-x86_64
            checksums.txt
          generate_release_notes: true
